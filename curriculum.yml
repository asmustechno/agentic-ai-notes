      - {slug: the-autonomy-spectrum, title: "The autonomy spectrum", level: beginner, min: 7, desc: "From a single prompt to a fully autonomous agent, one step at a time."}
      - {slug: how-llms-work, title: "How LLMs work (just enough)", level: beginner, min: 12, desc: "Tokens, context windows, temperature and system prompts."}
      - {slug: anatomy-of-an-agent, title: "Anatomy of an agent", level: beginner, min: 10, desc: "Model, instructions, tools, memory and loop: the five parts of every agent."}
      - {slug: when-not-to-use-an-agent, title: "When NOT to use an agent", level: beginner, min: 7, desc: "Signs that a simpler solution will serve you better."}

