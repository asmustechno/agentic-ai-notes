# Single source of truth for the book's structure.
#
# `python scripts/build_nav.py` reads this file and regenerates:
#   - the table of contents in README.md (between the TOC markers)
#   - SUMMARY.md
#   - the `nav:` section of mkdocs.yml (between the NAV markers)
#   - the page list in every chapter README (between the PAGES markers)
#   - stub files for any page that does not exist yet (never overwrites)
#
# To add a page: add one line here, run the script, then write the page.
# level: beginner (🟢) | intermediate (🟡) | advanced (🔴)
# min:   estimated reading time in minutes

chapters:
  - id: "00"
    slug: start-here
    title: Start Here
    desc: How these notes work, which path to follow, and how to set up the examples.
    pages:
      - {slug: how-to-use-these-notes, title: "How to use these notes", level: beginner, min: 5, desc: "How the notes are organised, what every page contains, and how to read them."}
      - {slug: learning-paths, title: "Learning paths", level: beginner, min: 5, desc: "Three routes through the material: Beginner, Builder and Production."}
      - {slug: setup, title: "Setup", level: beginner, min: 10, desc: "Install Python, add API keys, and run every example offline with MockLLM."}

