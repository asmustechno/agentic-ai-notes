name: Markdown lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rules and ignored paths are configured in .markdownlint-cli2.jsonc
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"
