<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">RAG for agents: indexing and agentic retrieval</title>
  <desc id="desc">Two lanes. Ahead of time, documents are chunked, embedded by an embedding model, and stored in a vector index plus a keyword index. At question time, the user's question goes to an agent, which decides whether and what to search, calls a search_docs tool that runs hybrid search and re-ranking over the index, reads the results, may search again, and finally answers with citations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="450" rx="16" fill="#FFFFFF"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#334155">RAG for agents: the pipeline in this chapter</text>

  <!-- Lane 1: indexing -->
  <rect x="20" y="56" width="920" height="150" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="40" y="82" font-size="14" font-weight="bold" fill="#334155">Ahead of time: indexing</text>

  <rect x="50" y="110" width="150" height="66" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-width="2"/>
  <text x="125" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">Documents</text>
  <text x="125" y="160" text-anchor="middle" font-size="12" fill="#92400E">docs, wikis, PDFs</text>

  <rect x="270" y="110" width="150" height="66" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="345" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Chunk</text>
  <text x="345" y="160" text-anchor="middle" font-size="12" fill="#334155">6.3</text>

  <rect x="490" y="110" width="170" height="66" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="575" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Embed</text>
  <text x="575" y="160" text-anchor="middle" font-size="12" fill="#3730A3">embedding model · 6.2</text>

  <rect x="730" y="110" width="190" height="66" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-width="2"/>
  <text x="825" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">Vector index</text>
  <text x="825" y="160" text-anchor="middle" font-size="12" fill="#92400E">+ keyword index · 6.2, 6.5</text>

  <line x1="200" y1="143" x2="266" y2="143" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="134" text-anchor="middle" font-size="12" fill="#334155">split</text>
  <line x1="420" y1="143" x2="486" y2="143" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="134" text-anchor="middle" font-size="12" fill="#334155">chunks</text>
  <line x1="660" y1="143" x2="726" y2="143" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="134" text-anchor="middle" font-size="12" fill="#334155">vectors</text>

  <!-- Lane 2: question time -->
  <rect x="20" y="236" width="920" height="196" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="40" y="262" font-size="14" font-weight="bold" fill="#334155">At question time: agentic RAG · 6.4</text>

  <rect x="50" y="296" width="150" height="70" rx="10" fill="#FCE7F3" stroke="#9D174D" stroke-width="2"/>
  <text x="125" y="327" text-anchor="middle" font-size="14" font-weight="bold" fill="#9D174D">User question</text>
  <text x="125" y="347" text-anchor="middle" font-size="12" fill="#9D174D">"plan with SSO: price?"</text>

  <rect x="270" y="296" width="190" height="70" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="365" y="327" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Agent (LLM)</text>
  <text x="365" y="347" text-anchor="middle" font-size="12" fill="#3730A3">search? which query? again?</text>

  <rect x="550" y="296" width="190" height="70" rx="10" fill="#CCFBF1" stroke="#115E59" stroke-width="2"/>
  <text x="645" y="327" text-anchor="middle" font-size="14" font-weight="bold" fill="#115E59">search_docs tool</text>
  <text x="645" y="347" text-anchor="middle" font-size="12" fill="#115E59">hybrid search + re-rank · 6.5</text>

  <rect x="790" y="296" width="130" height="70" rx="10" fill="#FCE7F3" stroke="#9D174D" stroke-width="2"/>
  <text x="855" y="327" text-anchor="middle" font-size="14" font-weight="bold" fill="#9D174D">Answer</text>
  <text x="855" y="347" text-anchor="middle" font-size="12" fill="#9D174D">with citations</text>

  <line x1="200" y1="331" x2="266" y2="331" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="322" text-anchor="middle" font-size="12" fill="#334155">asks</text>

  <line x1="460" y1="316" x2="546" y2="316" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="503" y="307" text-anchor="middle" font-size="12" fill="#334155">calls</text>
  <line x1="550" y1="348" x2="464" y2="348" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="503" y="366" text-anchor="middle" font-size="12" fill="#334155">results</text>

  <!-- index feeds the tool -->
  <path d="M 790 176 L 790 222 L 680 222 L 680 292" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="216" font-size="12" fill="#334155">reads</text>

  <!-- agent answers -->
  <path d="M 365 366 L 365 410 L 855 410 L 855 370" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="402" text-anchor="middle" font-size="12" fill="#334155">answers when it has enough, or says "not found"</text>
</svg>
