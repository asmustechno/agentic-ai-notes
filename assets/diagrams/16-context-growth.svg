<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">Why agent cost grows faster than the number of steps</title>
  <desc id="d">A bar chart of input tokens sent on each of 10 model calls in one agent run. Every bar has the same grey base of 3,100 tokens: the system prompt, tool definitions and goal, resent on every call. On top sits an amber block for the conversation history, which grows by 1,000 tokens per step, from zero on call 1 to 9,000 on call 10. The bars rise from 3,100 to 12,100 tokens. In total the run sends 76,000 input tokens: 31,000 of fixed prefix and 45,000 of history.</desc>
