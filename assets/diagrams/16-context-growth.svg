  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="30" y="40" font-size="20" font-weight="bold" fill="#334155">Every call resends everything before it</text>
    <text x="30" y="64" font-size="14" fill="#334155">Input tokens per model call in a 10-step agent run (fixed prefix 3,100 tokens; each step adds 1,000)</text>
