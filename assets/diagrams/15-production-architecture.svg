<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Architecture of a production agent</title>
  <desc id="desc">A client sends a request to an API layer, which checks it and either runs a short task directly or puts a job on a queue and returns a run id. A worker takes jobs from the queue and runs the agent loop. The loop calls models through a model gateway, which handles retries, rate limits and fallbacks between a primary and a backup provider, and calls tools through tool services. Guardrails check model inputs, outputs and risky tool calls. The worker saves checkpoints and results to a state store, which the API reads to report status. Observability collects traces, logs and metrics from every component, and evals run offline in CI and online on sampled traffic.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="600" rx="16" fill="#FFFFFF"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">Architecture of a production agent</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#334155">The agent loop is one box. Everything else keeps it reliable, safe and visible.</text>

  <!-- client -->
  <rect x="15" y="225" width="120" height="76" rx="10" fill="#FCE7F3" stroke="#9D174D" stroke-width="2"/>
  <text x="75" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#9D174D">Client</text>
  <text x="75" y="279" text-anchor="middle" font-size="12" fill="#9D174D">app, user, webhook</text>

  <!-- API layer -->
  <rect x="190" y="195" width="160" height="136" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="270" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">API layer</text>
  <text x="270" y="248" text-anchor="middle" font-size="13" fill="#334155">auth, validation</text>
  <text x="270" y="268" text-anchor="middle" font-size="13" fill="#334155">per-user limits</text>
  <text x="270" y="288" text-anchor="middle" font-size="13" fill="#334155">short task: answer</text>
  <text x="270" y="308" text-anchor="middle" font-size="13" fill="#334155">long task: 202 + run id</text>

  <!-- client <-> API -->
  <line x1="135" y1="250" x2="188" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="162" y="242" text-anchor="middle" font-size="12" fill="#334155">request</text>
  <line x1="188" y1="280" x2="137" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="162" y="298" text-anchor="middle" font-size="12" fill="#334155">reply</text>

  <!-- job queue -->
  <rect x="400" y="85" width="220" height="64" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-width="2"/>
  <text x="510" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">Job queue</text>
  <text x="510" y="133" text-anchor="middle" font-size="13" fill="#92400E">at-least-once, retries, DLQ</text>

  <!-- API -> queue (elbow) -->
  <path d="M270,195 L270,117 L398,117" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="334" y="108" text-anchor="middle" font-size="12" fill="#334155">enqueue job</text>

  <!-- worker container -->
  <rect x="400" y="190" width="220" height="150" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="510" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Worker</text>
  <rect x="420" y="226" width="180" height="96" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="510" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#3730A3">Agent loop</text>
  <text x="510" y="276" text-anchor="middle" font-size="13" fill="#3730A3">think, act, observe</text>
  <text x="510" y="296" text-anchor="middle" font-size="13" fill="#3730A3">step, time and cost limits</text>

  <!-- queue -> worker -->
  <line x1="510" y1="149" x2="510" y2="188" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="173" font-size="12" fill="#334155">deliver</text>

  <!-- state store -->
  <rect x="400" y="395" width="220" height="64" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-width="2"/>
  <text x="510" y="422" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">State store</text>
  <text x="510" y="443" text-anchor="middle" font-size="13" fill="#92400E">runs, checkpoints, results</text>

  <!-- worker -> state -->
  <line x1="510" y1="340" x2="510" y2="393" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="502" y="371" text-anchor="end" font-size="12" fill="#334155">checkpoint each step</text>

  <!-- API -> state (elbow) -->
  <path d="M270,331 L270,427 L398,427" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="334" y="418" text-anchor="middle" font-size="12" fill="#334155">read status</text>

  <!-- guardrails -->
  <rect x="660" y="85" width="280" height="64" rx="10" fill="#FEE2E2" stroke="#991B1B" stroke-width="2"/>
  <text x="800" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#991B1B">Guardrails</text>
  <text x="800" y="133" text-anchor="middle" font-size="13" fill="#991B1B">input and output checks, approvals</text>

  <!-- guardrails -> worker (elbow down then left) -->
  <path d="M700,149 L700,205 L622,205" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="180" font-size="12" fill="#334155">check</text>

  <!-- model gateway -->
  <rect x="660" y="225" width="150" height="84" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="735" y="251" text-anchor="middle" font-size="15" font-weight="700" fill="#3730A3">Model gateway</text>
  <text x="735" y="272" text-anchor="middle" font-size="13" fill="#3730A3">retries, rate limits</text>
  <text x="735" y="291" text-anchor="middle" font-size="13" fill="#3730A3">fallbacks, caching</text>

  <!-- worker -> gateway -->
  <line x1="600" y1="250" x2="658" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="639" y="242" text-anchor="middle" font-size="12" fill="#334155">chat</text>

  <!-- providers -->
  <rect x="840" y="215" width="100" height="44" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="890" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">Provider A</text>
  <text x="890" y="252" text-anchor="middle" font-size="12" fill="#3730A3">primary</text>
  <rect x="840" y="273" width="100" height="44" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="890" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">Provider B</text>
  <text x="890" y="310" text-anchor="middle" font-size="12" fill="#3730A3">fallback</text>
  <line x1="810" y1="240" x2="838" y2="237" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="290" x2="838" y2="294" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- tool services -->
  <rect x="660" y="345" width="280" height="82" rx="10" fill="#CCFBF1" stroke="#115E59" stroke-width="2"/>
  <text x="800" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#115E59">Tool services</text>
  <text x="800" y="393" text-anchor="middle" font-size="13" fill="#115E59">APIs, databases, search, sandbox</text>
  <text x="800" y="412" text-anchor="middle" font-size="13" fill="#115E59">side effects use idempotency keys</text>

  <!-- worker -> tools (elbow) -->
  <path d="M600,300 L640,300 L640,377 L658,377" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="647" y="336" font-size="12" fill="#334155">call tools</text>

  <!-- observability band -->
  <rect x="20" y="490" width="600" height="86" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="320" y="520" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Observability</text>
  <text x="320" y="543" text-anchor="middle" font-size="13" fill="#334155">every box above emits traces, structured logs and metrics:</text>
  <text x="320" y="562" text-anchor="middle" font-size="13" fill="#334155">latency, errors, tokens and cost per run</text>

  <!-- evals -->
  <rect x="660" y="490" width="280" height="86" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="800" y="520" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Evals</text>
  <text x="800" y="543" text-anchor="middle" font-size="13" fill="#334155">offline: a test set in CI</text>
  <text x="800" y="562" text-anchor="middle" font-size="13" fill="#334155">online: graders on sampled traces</text>
</svg>
