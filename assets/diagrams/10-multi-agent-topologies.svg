<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Four ways to arrange agents</title>
  <desc id="desc">Four panels. One agent: a single agent with its tools. Supervisor: a supervisor sends briefs to two specialists, which send reports back. Handoffs: a triage agent transfers control to billing or tech, and billing and tech can transfer to each other. Shared state: two agents read and write a shared blackboard with versioned keys.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="16" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#334155">Four ways to arrange agents</text>

  <!-- panel frames -->
  <rect x="16" y="56" width="220" height="368" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <rect x="252" y="56" width="220" height="368" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <rect x="488" y="56" width="220" height="368" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <rect x="724" y="56" width="220" height="368" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="126" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">① One agent</text>
  <text x="362" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">② Supervisor</text>
  <text x="598" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">③ Handoffs</text>
  <text x="834" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">④ Shared state</text>

  <!-- ① one agent -->
  <rect x="56" y="130" width="140" height="56" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="126" y="163" text-anchor="middle" font-size="14" fill="#3730A3">Agent</text>
  <line x1="126" y1="186" x2="126" y2="252" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="134" y="224" font-size="12" fill="#334155">calls</text>
  <rect x="56" y="256" width="140" height="56" rx="10" fill="#CCFBF1" stroke="#115E59" stroke-width="2"/>
  <text x="126" y="289" text-anchor="middle" font-size="14" fill="#115E59">Tools</text>
  <text x="126" y="356" text-anchor="middle" font-size="12" fill="#334155">One context, one loop.</text>
  <text x="126" y="374" text-anchor="middle" font-size="12" fill="#334155">Start here.</text>

  <!-- ② supervisor -->
  <rect x="292" y="120" width="140" height="50" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="362" y="150" text-anchor="middle" font-size="14" fill="#3730A3">Supervisor</text>
  <rect x="264" y="262" width="92" height="50" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="310" y="292" text-anchor="middle" font-size="14" fill="#3730A3">Specialist</text>
  <rect x="368" y="262" width="92" height="50" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="414" y="292" text-anchor="middle" font-size="14" fill="#3730A3">Specialist</text>
  <line x1="314" y1="170" x2="294" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="258" x2="340" y2="174" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="384" y1="170" x2="404" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="258" x2="410" y2="174" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="362" y="336" text-anchor="middle" font-size="12" fill="#334155">solid: brief · dashed: report</text>
  <text x="362" y="356" text-anchor="middle" font-size="12" fill="#334155">Control always returns</text>
  <text x="362" y="374" text-anchor="middle" font-size="12" fill="#334155">to the supervisor.</text>

  <!-- ③ handoffs -->
  <rect x="528" y="120" width="140" height="50" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="598" y="150" text-anchor="middle" font-size="14" fill="#3730A3">Triage</text>
  <rect x="498" y="262" width="74" height="50" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="535" y="292" text-anchor="middle" font-size="14" fill="#3730A3">Billing</text>
  <rect x="624" y="262" width="74" height="50" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="661" y="292" text-anchor="middle" font-size="14" fill="#3730A3">Tech</text>
  <line x1="570" y1="170" x2="540" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="626" y1="170" x2="656" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="577" y1="287" x2="619" y2="287" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="598" y="222" text-anchor="middle" font-size="12" fill="#334155">transfer</text>
  <text x="598" y="356" text-anchor="middle" font-size="12" fill="#334155">Control moves on. The</text>
  <text x="598" y="374" text-anchor="middle" font-size="12" fill="#334155">active agent answers.</text>

  <!-- ④ shared state -->
  <rect x="736" y="120" width="92" height="50" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="782" y="150" text-anchor="middle" font-size="14" fill="#3730A3">Agent A</text>
  <rect x="840" y="120" width="92" height="50" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="2"/>
  <text x="886" y="150" text-anchor="middle" font-size="14" fill="#3730A3">Agent B</text>
  <rect x="764" y="256" width="140" height="62" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-width="2"/>
  <text x="834" y="282" text-anchor="middle" font-size="14" fill="#92400E">Blackboard</text>
  <text x="834" y="302" text-anchor="middle" font-size="12" fill="#92400E">versioned keys</text>
  <line x1="790" y1="174" x2="808" y2="252" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="878" y1="174" x2="860" y2="252" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="834" y="222" text-anchor="middle" font-size="12" fill="#334155">read / write</text>
  <text x="834" y="356" text-anchor="middle" font-size="12" fill="#334155">Agents share a store.</text>
  <text x="834" y="374" text-anchor="middle" font-size="12" fill="#334155">Conflicts must be caught.</text>
</svg>
